name: Chrome extension semantic release
description: >-
  Version, build and submit a Chrome extension to the Chrome Web Store with
  semantic-release, then commit the version.
author: Pixpilot

branding:
  icon: package
  color: blue

inputs:
  working-directory:
    description: Folder of the extension's package.json, relative to the repository checkout.
    required: false
    default: .
  workspace-dependencies:
    description: >-
      Also count commits to the workspace packages the extension depends on,
      transitively, through dependencies, devDependencies or
      optionalDependencies. The workspace comes from pnpm-workspace.yaml or the
      package.json `workspaces` field (npm, Yarn, Bun).
    required: false
    default: 'true'
  ignore-workspace-packages:
    description: >-
      Newline- or comma-separated workspace package names to leave out, with
      anything reachable only through them: shared tooling, or a server package
      imported for types only. Unknown names fail the run.
    required: false
  dependency-updates:
    description: >-
      Also count commits that change a locked dependency version of the
      counted packages in pnpm-lock.yaml. Without a pnpm lockfile only file
      changes count.
    required: false
    default: 'true'
  paths:
    description: >-
      Newline- or comma-separated extra paths, relative to the repository checkout, whose
      commits also count. The extension's folder always counts.
    required: false
  branches:
    description: Newline- or comma-separated branches to release from.
    required: false
    default: main
  tag-format:
    description: >-
      Git tag format; must contain `${version}`. Make it unique per app in a
      monorepo, for example `chrome-extension-v${version}`.
    required: false
    default: v${version}
  manifest:
    description: >-
      Source manifest.json to bump as well, relative to `working-directory`.
      Leave empty when the build takes the version from package.json.
    required: false
  build-command:
    description: >-
      Shell command run in `working-directory` after the version is bumped,
      for example `pnpm run zip`.
    required: false
  package:
    description: >-
      What to upload, relative to `working-directory`: a .zip file, a folder
      holding exactly one .zip, or the unpacked build folder with its
      manifest.json. Required when `upload` is true.
    required: false
  upload:
    description: Upload the package to the Chrome Web Store.
    required: false
    default: 'true'
  submit:
    description: Submit the upload for review. When false it stays a draft.
    required: false
    default: 'true'
  extension-id:
    description: Chrome Web Store item ID.
    required: false
  publisher-id:
    description: Chrome Web Store publisher ID (API v2).
    required: false
  client-id:
    description: Google OAuth client ID.
    required: false
  client-secret:
    description: Google OAuth client secret.
    required: false
  refresh-token:
    description: Google OAuth refresh token.
    required: false
  commit:
    description: Commit the bumped version files back to the release branch.
    required: false
    default: 'true'
  commit-message:
    description: Release commit message, a lodash template like @semantic-release/git's.
    required: false
    default: |-
      chore(release): ${nextRelease.gitTag} [skip ci]

      ${nextRelease.notes}
  changelog-file:
    description: >-
      Changelog to update and commit, relative to `working-directory`. Leave
      empty for no changelog.
    required: false
  github-release:
    description: Create a GitHub release with the release notes.
    required: false
    default: 'true'
  github-token:
    description: >-
      Token that pushes the release commit and tag and creates the GitHub
      release. Use a GitHub App token when the branch is protected.
    required: false
    default: ${{ github.token }}
  dry-run:
    description: Report the next version without changing anything.
    required: false
    default: 'false'

outputs:
  released:
    description: Whether a new version was released (`false` in a dry run).
  version:
    description: The version released, or in a dry run the version that would be. Empty when there is none.
  previous-version:
    description: The last released version.
  tag:
    description: The release tag.
  release-type:
    description: major, minor or patch.
  notes:
    description: The release notes.
  package-path:
    description: Repository-relative path of the uploaded package.

runs:
  using: node24
  main: dist/index.js
