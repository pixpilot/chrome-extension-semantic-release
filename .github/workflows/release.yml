name: Release

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        !contains(github.event.workflow_run.head_commit.message || '', '[skip ci]') &&
        !contains(github.event.workflow_run.head_commit.message || '', '[ci skip]')
      }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic-release.outputs.new_release_published }}
      version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Project
        uses: pixpilot/github-actions/setup-pnpm-project@v1

      - name: Build dist
        run: npm run bundle

      - name: Semantic Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

  notify:
    name: Notify Release Status
    needs: release
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A successful run without a new release is routine, so keep it quiet.
      - name: Send Telegram release-status notification
        uses: pixpilot/notify-action@v1
        with:
          status: ${{ needs.release.result == 'success' && needs.release.outputs.released != 'true' && 'skipped' || needs.release.result }}
          notify-on: success, failure, cancelled
          title: >-
            ${{ needs.release.result == 'failure' && 'Chrome extension semantic-release failed'
            || needs.release.result == 'cancelled' && 'Chrome extension semantic-release cancelled'
            || needs.release.outputs.released == 'true' && format('Chrome extension semantic-release v{0} published', needs.release.outputs.version)
            || 'Chrome extension semantic-release skipped' }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
